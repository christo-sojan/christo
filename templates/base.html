<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EDUGUARD{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: #0d6efd !important;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            border-radius: 5px;
            margin: 5px 10px;
            transition: all 0.3s;
        }
        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .sidebar a.active {
            background: rgba(255,255,255,0.3);
        }
        .main-content {
            background: #f8f9fa;
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
        }
        .alert-card {
            border-left: 4px solid #dc3545;
        }
        .monitoring-status {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .video-container {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-3">
                    <h4 class="text-white text-center mb-4">
                        <i class="fas fa-shield-alt"></i> EDUGUARD
                    </h4>
                    <nav>
                        <a href="/" class="{% if request.endpoint == 'index' %}active{% endif %}">
                            <i class="fas fa-home"></i> Home
                        </a>
                        <a href="/dashboard" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a href="/students" class="{% if request.endpoint == 'students' %}active{% endif %}">
                            <i class="fas fa-users"></i> Students
                        </a>
                        <a href="/time_slots" class="{% if request.endpoint == 'time_slots' %}active{% endif %}">
                            <i class="fas fa-clock"></i> Time Slots
                        </a>
                        <a href="/attendance" class="{% if request.endpoint == 'attendance' %}active{% endif %}">
                            <i class="fas fa-calendar-check"></i> Attendance
                        </a>
                        <a href="/permissions" class="{% if request.endpoint == 'permissions' %}active{% endif %}">
                            <i class="fas fa-user-check"></i> Permissions
                        </a>
                        <a href="/alerts" class="{% if request.endpoint == 'alerts' %}active{% endif %}">
                            <i class="fas fa-exclamation-triangle"></i> Alerts
                        </a>
                        <a href="/officials" class="{% if request.endpoint == 'officials' %}active{% endif %}">
                            <i class="fas fa-user-tie"></i> Officials
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content p-4">
                <!-- Monitoring Status -->
                <div class="monitoring-status">
                    <div class="btn-group">
                        <button id="startMonitoring" class="btn btn-success btn-sm">
                            <i class="fas fa-play"></i> Start Monitoring
                        </button>
                        <button id="stopMonitoring" class="btn btn-danger btn-sm">
                            <i class="fas fa-stop"></i> Stop Monitoring
                        </button>
                    </div>
                </div>

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // Monitoring controls
        $('#startMonitoring').click(function() {
            $.post('/start_monitoring', function(response) {
                if (response.success) {
                    alert('Monitoring started successfully');
                    $(this).addClass('active');
                    $('#stopMonitoring').removeClass('active');
                }
            }.bind(this));
        });

        $('#stopMonitoring').click(function() {
            $.post('/stop_monitoring', function(response) {
                if (response.success) {
                    alert('Monitoring stopped successfully');
                    $(this).addClass('active');
                    $('#startMonitoring').removeClass('active');
                }
            }.bind(this));
        });

        // Auto-refresh alerts every 30 seconds
        setInterval(function() {
            if (window.location.pathname === '/alerts') {
                location.reload();
            }
        }, 30000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
